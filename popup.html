<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>小红书Cookie获取器</title>
  <style>
    :root {
      --primary-color: #ff2442;
      --bg-blur: 20px;
      --border-radius: 16px;
    }
    
    body {
      width: 300px;
      height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
      background: transparent;
      color: #333;
      position: relative;
      overflow: hidden;
    }
    
    .sidebar {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(var(--bg-blur));
      -webkit-backdrop-filter: blur(var(--bg-blur));
      border-radius: var(--border-radius);
      box-shadow: 
        0 10px 40px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(255, 255, 255, 0.8),
        inset 0 0 0 1px rgba(255, 255, 255, 0.5);
      animation: slide-in 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: top right;
    }
    
    @keyframes slide-in {
      0% {
        opacity: 0;
        transform: translateX(20px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    h2 {
      margin: 0;
      color: var(--primary-color);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    
    .pill {
      background: rgba(255, 36, 66, 0.1);
      color: var(--primary-color);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 10px;
    }
    
    textarea {
      width: 100%;
      height: 120px;
      padding: 14px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: calc(var(--border-radius) / 2);
      resize: vertical;
      font-family: "SF Mono", monospace;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(var(--bg-blur));
      -webkit-backdrop-filter: blur(var(--bg-blur));
      box-shadow: 
        inset 0 2px 4px rgba(0, 0, 0, 0.03),
        0 0 0 1px rgba(255, 255, 255, 0.8);
      transition: all 0.25s ease;
    }
    
    textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(255, 36, 66, 0.15);
    }
    
    button {
      padding: 12px 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: calc(var(--border-radius) / 2);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.25s ease;
      box-shadow: 
        0 2px 8px rgba(255, 36, 66, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    
    button:hover {
      background-color: #e61e39;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 36, 66, 0.25);
    }
    
    button:active {
      transform: translateY(0);
      background-color: #d91833;
      box-shadow: 0 1px 3px rgba(255, 36, 66, 0.2);
    }
    
    .status {
      color: #666;
      font-size: 13px;
      padding: 10px;
      border-radius: calc(var(--border-radius) / 2);
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(var(--bg-blur));
      -webkit-backdrop-filter: blur(var(--bg-blur));
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
      min-height: 16px;
    }

    .footer {
      position: relative;
      text-align: center;
      font-size: 11px;
      color: #888;
      margin-top: 10px;
      padding-top: 10px;
    }

    .footer::before {
      content: "";
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(0,0,0,0.1), transparent);
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="header">
      <h2>小红书Cookie获取器</h2>
      <span class="pill">1.0</span>
    </div>
    <textarea id="cookieData" readonly placeholder="等待获取cookie..."></textarea>
    <button id="copyButton">复制Cookie</button>
    <div id="status" class="status"></div>
    <div class="footer">
      Powered by @AI产品银海
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
